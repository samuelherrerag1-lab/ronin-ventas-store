<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RONIN VENTAS OS — @ronOverthinks Command Center</title>
    <!-- Fonts are 100% self-hosted offline via @fontsource bundle in src/index.css -->
    <style>
      @font-face {
        font-family: 'SF Pro Display';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: local('SF Pro Display'), local('SF Pro'), url('/fonts/SFPRODISPLAYREGULAR.woff') format('woff');
      }
      @font-face {
        font-family: 'SF Pro Display';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: local('SF Pro Display Semibold'), local('SF Pro'), url('/fonts/SFPRODISPLAYMEDIUM.woff') format('woff');
      }
      @font-face {
        font-family: 'SF Pro Display';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: local('SF Pro Display Bold'), local('SF Pro'), url('/fonts/SFPRODISPLAYBOLD.woff') format('woff');
      }
      :root {
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      }
      body {
        background-color: #070A12;
        color: #f4f4f5;
        font-family: 'Geist Variable', 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        overflow-x: hidden;
        background-image:
          radial-gradient(1100px 600px at 85% -10%, rgba(224, 122, 95, 0.12), transparent 60%),
          radial-gradient(900px 500px at -10% 110%, rgba(127, 178, 217, 0.07), transparent 60%);
        background-attachment: fixed;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.022;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      h1, h2, h3 {
        font-family: 'Bricolage Grotesque Variable', 'Bricolage Grotesque', 'Geist Variable', sans-serif;
        letter-spacing: -0.025em;
      }
      button {
        transition: transform 140ms var(--ease-out), background-color 140ms ease, border-color 140ms ease;
      }
      button:active:not(:disabled) {
        transform: scale(0.97);
      }
      .ronin-panel {
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0)), #0d0f14;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 18px 40px -28px rgba(0, 0, 0, 0.92);
      }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: #070A12; }
      ::-webkit-scrollbar-thumb { background: #1f2533; border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: #E07A5F; }
    </style>
  </head>
  <body class="bg-[#070A12] text-zinc-100 antialiased selection:bg-[#E07A5F] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
